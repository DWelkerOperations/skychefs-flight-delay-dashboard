<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SkyChefs Airlines On Time Performance dashboard with location and airline filters.">
  <meta name="theme-color" content="#ed2630">
  <title>SkyChefs Airlines On Time Performance</title>
  <style>
    :root {
      --skychefs-pride-red: #ed2630;
      --skychefs-clarity-white: #ffffff;
      --ink: #202124;
      --muted-ink: #5f6368;
      --line: #dedede;
      --page: #f5f5f5;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      background: var(--page);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    .brand-accent {
      background: var(--skychefs-pride-red);
      height: 7px;
    }

    .site-header {
      background: var(--skychefs-clarity-white);
      border-bottom: 1px solid var(--line);
    }

    .header-inner {
      align-items: center;
      display: flex;
      gap: 28px;
      justify-content: space-between;
      margin: 0 auto;
      max-width: 1500px;
      padding: 18px 28px;
    }

    .brand-logo {
      display: block;
      flex: 0 0 auto;
      height: auto;
      width: min(220px, 34vw);
    }

    .page-heading {
      border-left: 1px solid var(--line);
      margin-right: auto;
      padding-left: 28px;
    }

    h1 {
      font-size: clamp(19px, 2.2vw, 29px);
      font-weight: 600;
      letter-spacing: -0.015em;
      line-height: 1.15;
      margin: 0;
    }

    .subtitle {
      color: var(--muted-ink);
      font-size: 13px;
      line-height: 1.4;
      margin: 6px 0 0;
    }

    .snapshot-badge {
      background: var(--skychefs-pride-red);
      border-radius: 999px;
      color: var(--skychefs-clarity-white);
      flex: 0 0 auto;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 12px;
      white-space: nowrap;
    }

    main {
      margin: 0 auto;
      max-width: 1540px;
      padding: 18px;
    }

    .dashboard-frame {
      background: var(--skychefs-clarity-white);
      border: 1px solid var(--line);
      border-radius: 12px;
      display: block;
      height: 720px;
      min-height: 720px;
      width: 100%;
    }

    footer {
      background: var(--skychefs-clarity-white);
      border-top: 1px solid var(--line);
      color: var(--muted-ink);
      font-size: 12px;
      padding: 10px 28px;
      text-align: center;
    }

    .skip-link {
      background: var(--skychefs-pride-red);
      color: var(--skychefs-clarity-white);
      left: 12px;
      padding: 9px 12px;
      position: fixed;
      top: -60px;
      z-index: 10;
    }

    .skip-link:focus { top: 12px; }

    @media (max-width: 720px) {
      .header-inner {
        align-items: flex-start;
        flex-wrap: wrap;
        gap: 14px;
        padding: 15px 18px;
      }

      .brand-logo { width: 170px; }

      .page-heading {
        border-left: 0;
        border-top: 1px solid var(--line);
        order: 3;
        padding-left: 0;
        padding-top: 14px;
        width: 100%;
      }

      main { padding: 10px; }

      .dashboard-frame {
        border-radius: 8px;
        min-height: 760px;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#dashboard">Skip to dashboard</a>
  <header class="site-header">
    <div class="brand-accent" aria-hidden="true"></div>
    <div class="header-inner">
      <img class="brand-logo" src="assets/SkyChefs-logo-approved.svg" alt="SkyChefs">
      <div class="page-heading">
        <h1>Airlines On Time Performance</h1>
        <p class="subtitle">Arrival and departure delay metrics by location and marketed airline</p>
      </div>
      <div class="snapshot-badge">Data through Jul 20, 2026</div>
    </div>
  </header>

  <main id="dashboard">
    <iframe
      class="dashboard-frame"
      src="dashboard.html?v=4"
      title="SkyChefs Airlines On Time Performance dashboard"
      loading="eager">
    </iframe>
  </main>

  <footer>
    SkyChefs operational performance snapshot · Airline reflects the marketed flight-number prefix and may include codeshares
  </footer>
  <script>
    (() => {
      const frame = document.querySelector(".dashboard-frame");
      window.addEventListener("message", (event) => {
        const sameOrigin = location.protocol === "file:" || event.origin === location.origin;
        if (!sameOrigin || event.data?.type !== "skychefs-dashboard-height") return;
        const height = Number(event.data.height);
        if (Number.isFinite(height) && height >= 720 && height <= 12000) {
          frame.style.height = `${Math.ceil(height)}px`;
        }
      });
    })();
  </script>
</body>
</html>
